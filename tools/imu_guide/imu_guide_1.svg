<svg width="240" height="320" viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-weight="700">
  <!-- IMU/ESKF 入口の案内 1/3: SET PITCH。作り方は tools/imu_guide/prompt.md -->
  <rect width="240" height="320" fill="#FFFFFF"/>

  <!-- 見出し帯 -->
  <rect x="0" y="0" width="240" height="36" fill="#0000FF"/>
  <text x="8" y="25" font-size="18" fill="#FFFFFF">APPLY の前に確認</text>
  <text x="232" y="25" font-size="18" fill="#FFFFFF" text-anchor="end">1/3</text>

  <!-- 項目名 -->
  <text x="12" y="68" font-size="26" fill="#000000">SET PITCH</text>
  <text x="12" y="96" font-size="22" fill="#000000">＝ 地面の傾き</text>

  <!-- 図: 右下がりの台（傾きは 14° に誇張）に、横から見た人力飛行機が乗っている。機首は右 -->
  <polygon points="12,150 228,204 228,212 12,212" fill="#7B797B"/>
  <!-- 水平の補助線と、地面との角度。14° は狭いので弧の線ではなく扇形を塗る（線だと細い縦線にしか見えない） -->
  <path d="M 160 187 L 216 187 A 56 56 0 0 1 214.3 200.5 Z" fill="#FFB600"/>
  <line x1="12" y1="150" x2="228" y2="204" stroke="#000000" stroke-width="4"/>
  <line x1="160" y1="187" x2="228" y2="187" stroke="#7B797B" stroke-width="2" stroke-dasharray="6 4"/>
  <g transform="translate(100 172) rotate(14)">
    <!-- テールブームと T 尾翼 -->
    <line x1="-12" y1="-14" x2="-80" y2="-14" stroke="#000000" stroke-width="4"/>
    <polygon points="-80,-14 -86,-40 -76,-40 -68,-14" fill="#000000"/>
    <line x1="-92" y1="-41" x2="-70" y2="-41" stroke="#000000" stroke-width="4"/>
    <!-- 操縦席のフェアリング -->
    <path d="M -14 -13 C 0 -27 38 -27 52 -13 C 38 -1 0 -1 -14 -13 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <!-- パイロンと主翼（横から見た薄い断面） -->
    <line x1="20" y1="-24" x2="20" y2="-38" stroke="#000000" stroke-width="4"/>
    <ellipse cx="18" cy="-41" rx="24" ry="4" fill="#000000"/>
  </g>

  <!-- 本文 -->
  <text x="120" y="240" font-size="19" fill="#000000" text-anchor="middle">地面の傾きと同じか確認</text>
  <!-- 2 行は「台の上」と「平地」の頭をそろえ、まとまりとして中央に置く（「例：」は全角 2 文字 = 36px） -->
  <text x="36" y="264" font-size="18" fill="#7B797B">例：台の上は −3.5°</text>
  <text x="72" y="286" font-size="18" fill="#7B797B">平地は 0°</text>

  <!-- 下端の案内（「へ」と三角形の間は 12px） -->
  <rect x="0" y="292" width="240" height="2" fill="#7B797B"/>
  <text x="213" y="314" font-size="16" fill="#000000" text-anchor="end">スイッチを押すと次へ</text>
  <polygon points="225,301 235,308 225,315" fill="#000000"/>
</svg>
